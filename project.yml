name: LeafReader
options:
  bundleIdPrefix: com.weizhao
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TXCLU6TPCW
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  LeafReader:
    type: application
    platform: iOS
    sources:
      - path: LeafReader
        excludes: [Resources, Info.plist]
      - path: LeafReader/Resources/Reader
        type: folder
        buildPhase: resources
      - path: LeafReader/Resources/Samples
        type: folder
        buildPhase: resources
    info:
      path: LeafReader/Info.plist
      properties:
        CFBundleDisplayName: Leaf
        CFBundleShortVersionString: "1.10.0"
        CFBundleVersion: "45"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Books and documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container, com.adobe.pdf, com.amazon.mobi, com.amazon.azw, com.amazon.azw3, com.mobipocket.prc, org.fictionbook.fb2, org.fictionbook.fbz, com.comicbook.cbz, public.plain-text, net.daringfireball.markdown, public.html, public.rtf, public.zip-archive]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeConformsTo: [public.data]
            UTTypeDescription: EPUB book
            UTTypeTagSpecification: { public.filename-extension: [epub], public.mime-type: application/epub+zip }
          - UTTypeIdentifier: com.amazon.mobi
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Mobipocket book
            UTTypeTagSpecification: { public.filename-extension: [mobi], public.mime-type: application/x-mobipocket-ebook }
          - UTTypeIdentifier: com.amazon.azw
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Kindle book
            UTTypeTagSpecification: { public.filename-extension: [azw] }
          - UTTypeIdentifier: com.amazon.azw3
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Kindle Format 8 book
            UTTypeTagSpecification: { public.filename-extension: [azw3] }
          - UTTypeIdentifier: com.mobipocket.prc
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Mobipocket PRC book
            UTTypeTagSpecification: { public.filename-extension: [prc] }
          - UTTypeIdentifier: org.fictionbook.fb2
            UTTypeConformsTo: [public.xml]
            UTTypeDescription: FictionBook
            UTTypeTagSpecification: { public.filename-extension: [fb2] }
          - UTTypeIdentifier: org.fictionbook.fbz
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Compressed FictionBook
            UTTypeTagSpecification: { public.filename-extension: [fbz] }
          - UTTypeIdentifier: com.comicbook.cbz
            UTTypeConformsTo: [public.zip-archive]
            UTTypeDescription: Comic book archive
            UTTypeTagSpecification: { public.filename-extension: [cbz], public.mime-type: application/vnd.comicbook+zip }
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeDescription: Markdown document
            UTTypeTagSpecification: { public.filename-extension: [md, markdown] }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weizhao.leafreader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LeafReaderTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: LeafReaderTests
        excludes: [Fixtures]
      - path: LeafReaderTests/Fixtures
        type: folder
        buildPhase: resources
    resources:
      - path: LeafReaderTests/Fixtures
        type: folder
    dependencies:
      - target: LeafReader
  LeafReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [LeafReaderUITests]
    dependencies:
      - target: LeafReader
schemes:
  LeafReader:
    build:
      targets:
        LeafReader: all
    test:
      targets: [LeafReaderTests, LeafReaderUITests]
